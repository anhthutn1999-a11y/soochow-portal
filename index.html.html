<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>東吳大學校務行政系統 · Soochow Portal (Demo)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--bg:#FFF8EE;--sf:#FFFFFF;--bd:#F0DFC8;--tx:#20212B;--mu:#66565A;--br:#9E6752;--brt:#8A5642;--dk:#2D4354;--ok:#3F6F5B;--nt:#FFEBCF;--wn:#9A6400;--sh:0 1px 2px rgba(20,30,50,.06),0 8px 24px rgba(20,30,50,.06);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#20212B;--sf:#2A2B37;--bd:#4A3F43;--tx:#FFF1E0;--mu:#C9BBB0;--br:#9E6752;--brt:#F0B79F;--dk:#4F7A96;--ok:#8FC4A8;--nt:rgba(254,215,165,.14);--wn:#E8B04A;--sh:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 'Noto Sans TC',system-ui,sans-serif;background:var(--bg);color:var(--tx)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sf)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
h1{font-size:26px;margin:0 0 4px}h2{font-size:17px;margin:0 0 12px}
.mu{color:var(--mu);font-size:13px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:20px;box-shadow:var(--sh)}
.btn{min-height:44px;padding:0 18px;border:0;border-radius:10px;background:var(--br);color:#fff;font-weight:500}
[hidden]{display:none!important}
.tag.ok{background:transparent;color:var(--ok);border:1px solid var(--ok)}
#md:not(:empty),#cf:not(:empty){position:fixed;inset:0;z-index:30;background:rgba(10,16,30,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#cf:not(:empty){z-index:40}
.mdl{background:var(--sf);color:var(--tx);border-radius:16px;max-width:640px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.kv{display:grid;grid-template-columns:92px 1fr;gap:8px 12px;margin:14px 0}.kv span:nth-child(odd){color:var(--mu);font-size:13px}
.vd{border-radius:12px;padding:14px 16px;margin:14px 0}.vd.yes{background:rgba(63,111,91,.13)}.vd.maybe{background:var(--nt)}.vd.no{background:rgba(168,69,58,.12)}.vd.reg{background:rgba(45,67,84,.1)}
.rl{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:14px}
.ri{width:20px;height:20px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;margin-top:2px}.ri.ok{background:#3F6F5B}.ri.wn{background:#8C6A1E}.ri.bad{background:#A8453A}
@media(max-width:820px){#md:not(:empty),#cf:not(:empty){align-items:flex-end;padding:0}.mdl{border-radius:16px 16px 0 0;max-height:90dvh;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--bd);background:var(--sf)}
.chip[aria-pressed="true"]{background:var(--dk);color:#fff;border-color:var(--dk)}
.chip.s[aria-pressed="true"]{background:var(--br);border-color:var(--br)}
.bd{background:var(--br);color:#fff;border-radius:10px;font-size:11px;font-style:normal;padding:0 6px;margin-left:auto;line-height:18px}
.bnav button{position:relative}.bnav .bd{position:absolute;top:6px;left:calc(50% + 8px);margin:0}
.ni{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;text-align:left;padding:14px 12px 14px 22px;border:0;border-top:1px solid var(--bd);background:transparent;position:relative}
.ni:first-child{border-top:0}.ni.un::before{content:"";position:absolute;left:7px;top:20px;width:8px;height:8px;border-radius:50%;background:var(--br)}
.tag{font-size:12px;font-weight:700;padding:2px 10px;border-radius:10px;color:#fff;background:#73766A}.tag.fee{background:var(--br);color:#fff}.tag.sch{background:var(--dk);color:#fff}
.live{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:8px;animation:pl 1.6s infinite}@keyframes pl{50%{opacity:.3}}
.btn.ghost{background:transparent;color:var(--brt);border:1px solid var(--bd)}
.btn:disabled{opacity:.5;cursor:default}
.shell{display:grid;grid-template-columns:232px 1fr;align-items:start}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100dvh;background:var(--sf);color:var(--tx);border-right:1px solid var(--bd);padding:20px 14px;display:flex;flex-direction:column;gap:6px}
.logo{font-weight:700;font-size:19px;padding:6px 10px 18px;display:flex;align-items:center;gap:10px}.logo small{display:block;font-weight:400;font-size:12px;opacity:.8}
.nb{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:inherit;text-align:left;width:100%}
.nb[aria-current="page"]{background:#FED7A5;color:#2D4354;font-weight:700}
.nb svg,.bnav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bnav{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:12px;align-items:center;padding:12px 28px;background:var(--sf);border-bottom:3px solid var(--br)}
.top .sp{flex:1;font-weight:700}
.seg{display:flex;border:1px solid var(--bd);border-radius:22px;overflow:hidden}
.seg button{min-height:40px;min-width:56px;border:0;background:transparent;color:var(--mu);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--br);color:#fff}
.ib{min-width:44px;min-height:44px;border-radius:22px;border:1px solid var(--bd);background:transparent;display:flex;align-items:center;justify-content:center}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
.av{width:36px;height:36px;border-radius:50%;background:#FED7A5;color:#2D4354;display:flex;align-items:center;justify-content:center;font-weight:700}
#v{padding:28px;max-width:1100px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:20px 0}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:16px}
.stat b{display:block;font-size:30px;line-height:1.2}
.qk{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.qk button{min-height:84px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.qk button:hover{border-color:var(--brt)}.qk svg{width:24px;height:24px;fill:none;stroke:var(--brt);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}.row>div:first-child{flex:1}
.sw{width:50px;min-height:30px;border-radius:15px;border:0;background:var(--bd);position:relative}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked="true"]{background:var(--ok)}.sw[aria-checked="true"]::after{left:23px}
.meter{height:10px;border-radius:5px;background:var(--bd);overflow:hidden;margin:8px 0}.meter i{display:block;height:100%;background:var(--br)}
.sc{overflow-x:auto}.tw{position:relative;min-width:560px}
.ttg{display:grid;grid-template-columns:64px repeat(5,1fr);grid-template-rows:36px repeat(8,56px)}
.ttg.ov{position:absolute;inset:0;pointer-events:none}
.th,.pl{display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mu);font-weight:500}
.ce{border-top:1px solid var(--bd);border-left:1px solid var(--bd)}
.blk{margin:2px;padding:6px 8px;border-radius:8px;background:var(--bk);color:#fff;font-size:13px;line-height:1.3;overflow:hidden}.blk span{display:block;opacity:.85;font-size:12px}
.inp{width:100%;min-height:44px;border:1px solid var(--bd);border-radius:10px;padding:0 14px;background:var(--sf)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 6px;border-top:1px solid var(--bd)}th{color:var(--mu);font-size:13px;font-weight:500;border-top:0}
.st{display:flex;gap:12px;align-items:center;padding:9px 0}.dot{width:14px;height:14px;border-radius:50%;background:var(--bd);flex:none}.dot.d{background:var(--ok)}.dot.c{background:var(--br)}
.log{min-height:100dvh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:linear-gradient(150deg,#FFF1DC,#FED7A5 58%,#EDBB96);color:#20212B;padding:48px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;border:60px solid rgba(45,67,84,.08);right:-160px;top:-140px}
.hero h1{font-size:40px}.hero p{max-width:420px;opacity:.9}
.lf{display:flex;flex-direction:column;justify-content:center;gap:14px;padding:48px;max-width:460px;width:100%;margin:auto}
.lf label{font-size:13px;color:var(--mu);display:block;margin-bottom:4px}
.note{background:var(--nt);border-radius:10px;padding:10px 14px;font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#20212B;color:#fff;padding:12px 20px;border-radius:24px;opacity:0;transition:.2s;pointer-events:none;z-index:20;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){
.shell{display:block}.side{display:none}#v{padding:20px 16px 100px}.top{padding:10px 16px}
.bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav button{flex:1;min-height:60px;border:0;background:transparent;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.bnav button[aria-current="page"]{color:var(--brt);font-weight:700}
.log{grid-template-columns:1fr}.hero{padding:32px 24px;min-height:220px}.hero h1{font-size:28px}.lf{padding:28px 24px}
.hid{display:none}}
</style>
</head>

const colChips=()=>chip('col','all',t('all'),S.col==='all')+DEPT.map(d=>chip('col',d.id,S.lang==='zh'?d.zh:d.en,S.col===d.id)).join('');
const majChips=()=>chip('maj','all',t('all'),S.maj==='all','s')+DEPT.find(d=>d.id===S.col).m.map(m=>chip('maj',m[0],S.lang==='zh'?m[1]:m[2],S.maj===m[0],'s')).join('');
function cl(){const q=S.q.trim().toLowerCase();return C.filter(c=>(!q||(c.zh+c.en).toLowerCase().includes(q))&&(S.col==='all'||colOf(c.m)===S.col)&&(S.maj==='all'||c.m===S.maj)).map(c=>{const on=S.reg.includes(c.id);return `<div class="row"><div><b>${cn(c)}</b> <span class="tag ${isReq(c)?'fee':'sch'}">${isReq(c)?z('必修','Required'):z('選修','Elective')}</span>${on?` <span class="tag ok">${z('已加選','Registered')}</span>`:''}<div class="mu">${mn(c.m)} · ${c.cr} ${t('cr')} · ${dl(c)} ${pl(c.p)}–${pl(c.p+1)}</div></div><button class="btn ghost" data-a="info" data-v="${c.id}">${z('課程資訊','Details')}</button></div>`}).join('')}
function co(){return `<h1>${t('coT')}</h1><div class="card" style="margin:16px 0"><div class="mu" style="margin-bottom:8px">${z('我的科系','My major')}: <b style="color:var(--tx)">${mn(ME)}</b> · ${z('已修學分','Earned')} ${EARNED} / ${GRADN}</div><div class="note" style="margin-bottom:12px">${z('加選截止','Add deadline')}: <b>${dtx(ADL)}</b> · ${z('退選截止','Drop deadline')}: <b>${dtx(DDL)}</b> <span class="mu">(${z('示範日期','sample dates')})</span></div><span class="mu">${t('lim')}</span> <b>${sum()} / ${LIM}</b><div class="meter"><i style="width:${Math.min(100,sum()/LIM*100)}%"></i></div></div><div class="mu">${t('colL')}</div><div class="chips">${colChips()}</div>${S.col!=='all'?`<div class="mu">${t('majL')}</div><div class="chips">${majChips()}</div>`:''}<label for="q" class="mu" style="position:absolute;left:-9999px">${t('search')}</label><input id="q" class="inp" placeholder="${t('search')}" value="${S.q}" style="margin-bottom:12px"><div class="card" id="cl">${cl()}</div>`}
const unread=()=>S.feed.filter(x=>!x.r).length;
const badge=()=>document.querySelectorAll('.bd').forEach(e=>{e.textContent=unread();e.hidden=!unread()});
function ago(ts){const m=Math.max(0,Math.round((Date.now()-ts)/6e4)),z=S.lang==='zh';return m<1?(z?'剛剛':'Just now'):m<60?(z?m+' 分鐘前':m+' min ago'):(z?Math.floor(m/60)+' 小時前':Math.floor(m/60)+' h ago')}
function left(d){const n=Math.max(0,Math.ceil((d-Date.now())/864e5));return S.lang==='zh'?'剩 '+n+' 天':n+' days left'}
function nl(){const l=S.feed.filter(x=>S.nf==='all'||x.k===S.nf);return l.length?l.map(x=>`<button class="ni ${x.r?'':'un'}" data-a="rd" data-v="${x.id}"><span class="tag ${x.k}">${t('k_'+x.k)}</span><b>${S.lang==='zh'?x.zh:x.en}</b><span class="mu">${S.lang==='zh'?x.bz:x.be}</span><span class="mu">${ago(x.t)}${x.due?' · '+left(x.due):''}</span></button>`).join(''):`<p class="mu">${t('ntNone')}</p>`}
function nt(){return `<h1>${t('ntT')}</h1><p class="mu"><span class="live"></span>${t('live')}</p><div class="note" style="margin:12px 0">${t('ntDemo')}</div><div class="chips">${['all','fee','sch','news'].map(k=>chip('nf',k,t('k_'+k)+' ('+(k==='all'?S.feed.length:S.feed.filter(x=>x.k===k).length)+')',S.nf===k)).join('')}</div><div class="chips"><button class="btn" data-a="sim">${t('sim')}</button><button class="btn ghost" data-a="readall">${t('readAll')}</button></div><div class="card" id="nl">${nl()}</div>`}
function push(){const a=POOL[S.pi++%POOL.length];S.feed.unshift(mk(a,0,false));toast(t('newN')+' · '+(S.lang==='zh'?a[1]:a[2]));if(S.tab==='nt'||S.tab==='home')refresh();badge()}
function rec(c){const on=S.reg.includes(c.id);if(on)return{v:'reg',I:[]};const I=[],ld=sum()+c.cr,d=DET[c.id],pr=d[5]?byId(d[5]):null;
const cf=reg().find(r=>r.d===c.d&&Math.abs(r.p-c.p)<2);
if(cf)I.push(['bad',z('與已選課程「'+cn(cf)+'」衝堂','Time conflict with “'+cn(cf)+'”')]);
if(ld>LIM)I.push(['bad',z('加選後共 '+ld+' 學分,超過上限 '+LIM,'Adding it gives '+ld+' credits, over the limit of '+LIM)]);
if(pr){const n=cn(pr);if(DONE.includes(pr.id))I.push(['ok',z('先修課「'+n+'」已修畢','Prerequisite “'+n+'” completed')]);else if(S.reg.includes(pr.id))I.push(['wn',z('先修課「'+n+'」本學期同時修習,請確認是否允許','Prerequisite “'+n+'” is in progress this term; confirm concurrent enrollment is allowed')]);else I.push(['bad',z('先修課「'+n+'」尚未修畢,也未列入本學期','Prerequisite “'+n+'” is neither completed nor planned this term')])}
const lf=C.filter(x=>isReq(x)&&!S.reg.includes(x.id)&&!DONE.includes(x.id)&&x.id!==c.id),lc=lf.reduce((a,x)=>a+x.cr,0);
if(isReq(c))I.push(['ok',z('為你的科系('+mn(ME)+')必修','Required for your major ('+mn(ME)+')')]);else if(lf.length)I.push(['wn',z('你還有 '+lf.length+' 門必修('+lc+' 學分)尚未排入本學期,建議優先選必修','You still have '+lf.length+' required course(s) ('+lc+' credits) not planned this term; prioritize them')]);else I.push(['ok',z('必修皆已排入,可依興趣選修','All required courses are planned, so electives are a good fit')]);
if(ld<=LIM)I.push([ld>18?'wn':'ok',ld>18?z('加選後 '+ld+' 學分,學期負擔偏重(建議 18 以內)','Adding it gives '+ld+' credits, a heavy load (18 or fewer is advised)'):z('加選後 '+ld+' / '+LIM+' 學分,負擔適中','Adding it gives '+ld+' / '+LIM+' credits, a balanced load')]);
return{v:I.some(x=>x[0]==='bad')?'no':I.some(x=>x[0]==='wn')?'maybe':'yes',I}}
function md(){const e=$('#md');if(!S.info||!S.login){e.innerHTML='';return}
const c=byId(S.info),r=rec(c),d=DET[c.id],on=S.reg.includes(c.id),pr=d[5]?byId(d[5]):null,rq=isReq(c);
const VT={yes:z('建議選修','Recommended'),maybe:z('可考慮,請留意以下事項','Possible; review the notes below'),no:z('目前不建議加選','Not recommended right now'),reg:z('你已加選此課程','You are already registered')};
e.innerHTML=`<div class="mdl" role="dialog" aria-modal="true" aria-labelledby="mt"><div style="display:flex;gap:12px;align-items:flex-start"><div style="flex:1"><h2 id="mt" style="font-size:20px;margin:0 0 8px">${cn(c)}</h2><span class="tag ${rq?'fee':'sch'}">${rq?z('必修','Required'):z('選修','Elective')}</span> <span class="mu">${c.cr} ${t('cr')}</span></div><button class="ib x" data-a="close" aria-label="${z('關閉','Close')}">✕</button></div>
<div class="kv"><span>${z('授課教師','Instructor')}</span><span>${z(d[0],d[1])}</span><span>${z('上課時間','Schedule')}</span><span>${dl(c)} ${pl(c.p)}–${pl(c.p+1)}</span><span>${z('開課科系','Department')}</span><span>${mn(c.m)}</span><span>${z('先修課','Prerequisite')}</span><span>${pr?cn(pr):z('無','None')}</span><span>${z('課程內容','Content')}</span><span>${z(d[2],d[3])}</span></div>
<div class="vd ${r.v}"><b>${VT[r.v]}</b>${r.I.map(x=>`<div class="rl"><span class="ri ${x[0]}" aria-hidden="true">${x[0]==='ok'?'✓':x[0]==='wn'?'!':'✕'}</span><span>${x[1]}</span></div>`).join('')}</div>
<p class="mu">${z('依你的學分狀況評估:已修 ','Based on your record: earned ')}${EARNED} / ${GRADN} ${t('cr')} · ${z('本學期 ','this term ')}${sum()} / ${LIM}</p><p class="mu">${z('教師與課程內容為示範資料','Instructor and content are sample data')}</p><p><b>${on?z('退選截止','Drop deadline'):z('加選截止','Add deadline')}:</b> ${dtx(on?DDL:ADL)}</p>
<button class="btn ${on?'ghost':''}" data-a="${on?'drop':'add'}" data-v="${c.id}">${on?t('drop'):t('add')}</button></div>`;e.querySelector('.x').focus()}
function cf(){const e=$('#cf');if(!S.cf||!S.login){e.innerHTML='';return}const x=S.cf,c=byId(x.id),ad=x.a==='add',dl=ad?ADL:DDL,after=sum()+(ad?c.cr:-c.cr),urg=dd(dl)<=3;
e.innerHTML=`<div class="mdl" style="max-width:460px" role="alertdialog" aria-modal="true" aria-labelledby="ct"><h2 id="ct" style="font-size:19px">${ad?z('確定要加選這門課嗎?','Do you really want to add this course?'):z('確定要退選這門課嗎?','Do you really want to drop this course?')}</h2><p><b>${cn(c)}</b> · ${c.cr} ${t('cr')}</p><p class="mu">${z('確認後本學期學分為 ','After this, your term credits will be ')}<b style="color:var(--tx)">${after} / ${LIM}</b></p><div class="vd ${urg?'no':'reg'}"><b>${ad?z('加選截止','Add deadline'):z('退選截止','Drop deadline')}: ${dtx(dl)}</b>${urg?`<div class="rl">${z('即將截止,請盡快完成。','The deadline is close, so act soon.')}</div>`:''}${ad?'':`<div class="rl">${z('過了截止日將無法在線上退選,請再次確認。','After the deadline you can no longer drop online, so please double-check.')}</div>`}</div><div style="display:flex;gap:12px;justify-content:flex-end"><button class="btn ghost c" data-a="no">${z('取消','Cancel')}</button><button class="btn k" data-a="ok">${ad?z('確定加選','Yes, add'):z('確定退選','Yes, drop')}</button></div></div>`;e.querySelector(ad?'.k':'.c').focus()}
function gr(){return `<h1>${t('grT')}</h1><p class="mu">${t('grTerm')} · GPA ${gpa()}</p><div class="card"><table><tr><th>${t('grC')}</th><th>${t('cr')}</th><th>${t('grG')}</th></tr>${G.map(g=>`<tr><td>${S.lang==='zh'?g[0]:g[1]}</td><td>${g[2]}</td><td><b>${g[3]}</b></td></tr>`).join('')}</table></div>`}
function fm(){const f=S.fm,r=reg();let h=`<h1>${t('fmT')}</h1><p class="mu">${t('fmD')}</p><div class="card">`;
if(!f){h+=r.length?`<label for="fs" class="mu">${t('fmPick')}</label><select id="fs" class="inp" style="margin:6px 0 14px"><option value="">${t('fmPh')}</option>${r.map(c=>`<option value="${c.id}" ${S.fsel==c.id?'selected':''}>${cn(c)}</option>`).join('')}</select><button class="btn" data-a="fsub">${t('fmSub')}</button>`:`<p class="mu">${t('fmEmpty')}</p>`}
else{h+=`<b>${cn(byId(f.c))}</b>`+t('fmSteps').map((s,i)=>`<div class="st"><span class="dot ${i<f.step?'d':i===f.step?'c':''}"></span>${s}</div>`).join('')+(f.step<4?`<p class="mu">${t('fmSim')}</p><button class="btn" data-a="fnext">${t('fmNext')}</button>`:`<button class="btn ghost" data-a="fnew">${t('fmNew')}</button>`)}
return h+'</div>'}
function render(){document.documentElement.lang=S.lang==='zh'?'zh-Hant':'en';$('#app').innerHTML=S.login?shell():loginV();md();cf()}
const refresh=()=>{$('#v').innerHTML=view()};
const act={lang(v){S.lang=v;try{localStorage.setItem('lang',v)}catch(e){}render()},
theme(){const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'},
login(){S.login=true;render()},logout(){S.login=false;S.tab='home';render()},tab(v){S.tab=v;render();scrollTo(0,0)},tf(){S.tf=!S.tf;refresh()},
add(v){const c=byId(+v);if(Date.now()>ADL)return toast(z('已過加選截止日','The add deadline has passed'));if(sum()+c.cr>LIM)return toast(t('tLim'));if(conf(c))return toast(t('tConf'));S.cf={a:'add',id:c.id};cf()},
ok(){const x=S.cf,c=byId(x.id);S.cf=null;if(x.a==='add'){S.reg.push(c.id);toast(t('tAdd')+' · '+cn(c))}else{S.reg=S.reg.filter(i=>i!==c.id);toast(t('tDrop')+' · '+cn(c))}refresh();md();cf()},no(){S.cf=null;cf()},
drop(v){if(Date.now()>DDL)return toast(z('已過退選截止日','The drop deadline has passed'));S.cf={a:'drop',id:+v};cf()},
fsub(){if(!S.fsel)return toast(t('tNeed'));S.fm={c:+S.fsel,step:1};toast(t('tSent'));refresh()},
fnext(){S.fm.step++;if(S.fm.step>=4){S.reg=S.reg.filter(i=>i!==S.fm.c);toast(t('tFin'))}refresh()},
fnew(){S.fm=null;S.fsel='';refresh()},
info(v){S.info=+v;md()},close(){S.info=null;md()},col(v){S.col=v;S.maj='all';refresh()},maj(v){S.maj=v;refresh()},nf(v){S.nf=v;refresh()},sim(){push()},
readall(){S.feed.forEach(x=>x.r=true);refresh();badge()},rd(v){S.feed.find(i=>i.id===+v).r=true;$('#nl').innerHTML=nl();badge()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&act[b.dataset.a])act[b.dataset.a](b.dataset.v)});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;$('#cl').innerHTML=cl()}});
document.addEventListener('change',e=>{if(e.target.id==='fs')S.fsel=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!S.login&&(e.target.id==='u'||e.target.id==='p'))act.login()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.cf)act.no();else if(S.info)act.close()}});document.addEventListener('click',e=>{if(e.target.id==='cf')act.no();else if(e.target.id==='md')act.close()});
render();setInterval(()=>{if(S.login)push()},20000);
</script>
</body>
</html>
